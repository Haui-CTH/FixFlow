server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Nén văn bản (JS/CSS/SVG/JSON) — font woff2 đã nén sẵn
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # File build có hash trong tên: cache lâu, không cần kiểm tra lại
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy tài liệu API, OpenAPI JSON và màn hình giám sát về Gateway
    location ~ ^/(docs|monitor|redoc|openapi.json) {
        proxy_connect_timeout 5s;
        proxy_pass http://gateway:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_connect_timeout 5s;
        proxy_pass http://gateway:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: mọi route (vd /tickets/123) trả index.html; luôn kiểm tra lại để nhận bản build mới
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
