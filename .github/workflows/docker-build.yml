# DX-FSM Docker Build & Push

name: Build & Push Docker Images

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build Ticket Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/ticket-service
          push: false
          tags: ${{ steps.meta.outputs.tags }}-ticket-service:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/ai-service
          push: false
          tags: ${{ steps.meta.outputs.tags }}-ai-service:${{ github.ref_name }}

      - name: Build Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          tags: ${{ steps.meta.outputs.tags }}-frontend:${{ github.ref_name }}
