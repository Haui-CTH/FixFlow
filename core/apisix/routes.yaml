# APISIX Routes
# DX-FSM API Gateway Routes

routes:
  # ─── Ticket Service ───────────────────────────────────────
  - id: ticket-service-tickets
    uri: /api/v1/tickets
    upstream:
      type: roundrobin
      nodes:
        - host: ticket-service
          port: 8001
          weight: 100
    plugins:
      cors:
        enabled: true
      jwt-auth:
        enabled: false  # Disable JWT for demo; enable in production

  - id: ticket-service-ticket-detail
    uri: /api/v1/tickets/*
    upstream:
      type: roundrobin
      nodes:
        - host: ticket-service
          port: 8001
          weight: 100

  # ─── User Service ─────────────────────────────────────────
  - id: user-service
    uri: /api/v1/users
    upstream:
      type: roundrobin
      nodes:
        - host: ticket-service
          port: 8001
          weight: 100

  # ─── AI Service ────────────────────────────────────────────
  - id: ai-classify
    uri: /api/v1/classify
    upstream:
      type: roundrobin
      nodes:
        - host: ai-service
          port: 8002
          weight: 100
    plugins:
      proxy-rewrite:
        uri: /classify

  - id: ai-recommend
    uri: /api/v1/recommend
    upstream:
      type: roundrobin
      nodes:
        - host: ai-service
          port: 8002
          weight: 100
    plugins:
      proxy-rewrite:
        uri: /recommend

  - id: ai-health
    uri: /api/v1/ai/health
    upstream:
      type: roundrobin
      nodes:
        - host: ai-service
          port: 8002
          weight: 100
    plugins:
      proxy-rewrite:
        uri: /health

  # ─── Notification Service ──────────────────────────────────
  - id: notification-service
    uri: /api/v1/notifications
    upstream:
      type: roundrobin
      nodes:
        - host: notification-service
          port: 8003
          weight: 100

  # ─── Health Check ──────────────────────────────────────────
  - id: gateway-health
    uri: /health
    upstream:
      type: roundrobin
      nodes:
        - host: ticket-service
          port: 8001
          weight: 100
    plugins:
      proxy-rewrite:
        uri: /health

# Upstreams (defined separately)
upstreams:
  - id: ticket-service-upstream
    type: roundrobin
    nodes:
      - host: ticket-service
        port: 8001
        weight: 100
    checks:
      active:
        type: http
        http_path: /health
        interval: 30
        timeout: 10

  - id: ai-service-upstream
    type: roundrobin
    nodes:
      - host: ai-service
        port: 8002
        weight: 100
    checks:
      active:
        type: http
        http_path: /health
        interval: 30
        timeout: 10
