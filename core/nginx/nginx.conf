# DX-FSM Nginx Gateway (thay thế APISIX)
# Routing tương đương core/apisix/routes.yaml.
# Lý do: APISIX image bị Docker Hub proxy chặn. Nginx nằm trong library/*.

# Key: resolver 127.0.0.11 (Docker DNS) + proxy_pass với BIẾN
# để nginx re-resolve upstream mỗi request (không cache DNS lúc startup).

user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format json_combined escape=json
      '{"time":"$time_iso8601",'
      '"request_id":"$request_id",'
      '"remote_ip":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"duration_ms":$request_time,'
      '"upstream":"$upstream_addr",'
      '"upstream_time":"$upstream_response_time",'
      '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_combined;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;

    # Docker internal DNS – cho phép re-resolve động
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Rate limiting zone cho cổng xác thực công khai (chống brute-force / DoS)
    limit_req_zone $binary_remote_addr zone=verify_limit:10m rate=15r/s;

    # ─── CORS headers helper ──────────────────────────────────────────────
    # Dùng bằng cách include trong từng location proxy
    map $request_method $cors_origin {
        default "http://localhost:3000";
        OPTIONS "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Hỗ trợ Reverse Proxy & Cloudflare Tunnel (bảo toàn HTTPS và cổng 443)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $forwarded_proto $default_port_by_proto {
        https   443;
        default $server_port;
    }

    map $http_x_forwarded_port $forwarded_port {
        default $http_x_forwarded_port;
        ""      $default_port_by_proto;
    }

    # ─── Public server (port 80) ───────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Propagate unique Request-Id header to client for end-to-end tracing
        add_header X-Request-Id $request_id always;

        # Upstream ngừng/không phản hồi: báo lỗi sau 5 giây thay vì treo 60 giây (mặc định)
        proxy_connect_timeout 5s;

        # OPTIONS preflight – phải ở trước để không bị catch-all 404
        location = /_preflight {
            internal;
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            return 204;
        }

        # OPTIONS request → preflight
        if ($request_method = OPTIONS) {
            rewrite ^ /_preflight last;
        }

        # ─── Keycloak Authentication (Same-Origin / Unified Gateway) ────
        location /realms/ {
            set $kc keycloak;
            proxy_pass http://$kc:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location /resources/ {
            set $kc keycloak;
            proxy_pass http://$kc:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        location /js/ {
            set $kc keycloak;
            proxy_pass http://$kc:8080;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        # ─── System Observability & Tracing (/monitor) ─────────────────
        location = /monitor {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/monitor;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_set_header X-Request-Id $request_id;
        }

        location = /monitor/ {
            rewrite ^ /monitor permanent;
        }

        # ─── API Documentation & Swagger UI (Công khai cho Hội đồng chấm thi) ────
        location ~ ^/(docs|swagger-ui|swagger-ui.html|tai-lieu-api) {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        location = /redoc {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        location = /api/v1/openapi.json {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        location = /api/v1/ai/openapi.json {
            set $as ai-service;
            proxy_pass http://$as:8002/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        location = /openapi.json {
            rewrite ^ /api/v1/openapi.json last;
        }

        # ─── Catch-all for API Gateway v1 ──────────────────────────────
        location /api/v1/ {
            set $ts ticket-service;
            rewrite ^/api/v1/(.*)$ /$1 break;
            proxy_pass http://$ts:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        # ─── Frontend Web App (FixFlow UI Single Origin) ───────────────
        location / {
            set $app app;
            proxy_pass http://$app:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ─── Health check ──────────────────────────────────────────────
        location = /health {
            proxy_pass http://ticket-service:8001/health;
        }

        # ─── Ticket Service ────────────────────────────────────────────
        # GET /api/v1/tickets  (không trailing slash)
        location = /api/v1/tickets {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/tickets$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Cổng xác thực công khai Biên bản Nghiệm thu (Rate-limited) ───
        location /api/v1/tickets/verify/ {
            limit_req zone=verify_limit burst=30 nodelay;
            set $ts ticket-service;
            rewrite ^/api/v1/(tickets/.*)$ /$1 break;
            proxy_pass http://$ts:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header X-Forwarded-Port $forwarded_port;
        }

        # /api/v1/tickets/* (detail, comments, attachments, history)
        location /api/v1/tickets/ {
            set $ts ticket-service;
            rewrite ^/api/v1/(tickets/.*)$ /$1 break;
            proxy_pass http://$ts:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /api/v1/tickets/stats/summary (exact, không trailing slash)
        location /api/v1/tickets/stats/summary {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/tickets/stats/summary$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /api/v1/tickets/overdue
        location = /api/v1/tickets/overdue {
            set $ts ticket-service;
            proxy_pass http://$ts:8001/tickets/overdue$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Admin (metrics, outbox...) ───────────────────────────────
        # Variable in proxy_pass => URI is not mapped, so rewrite explicitly
        location /api/v1/admin/ {
            set $ts ticket-service;
            rewrite ^/api/v1/(admin/.*)$ /$1 break;
            proxy_pass http://$ts:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── User Service ───────────────────────────────────────────────
        location /api/v1/users {
            set $ts ticket-service;
            rewrite ^/api/v1/(users.*)$ /$1 break;
            proxy_pass http://$ts:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Notification Service ─────────────────────────────────────
        # Thông báo trong app (list/đọc) do ticket-service xử lý; notification-service chỉ gửi email/sms/push (/notify)
        location /api/v1/notifications {
            set $ts ticket-service;
            rewrite ^/api/v1/(notifications.*)$ /$1 break;
            proxy_pass http://$ts:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── AI Service ───────────────────────────────────────────────
        location /api/v1/classify {
            set $as ai-service;
            rewrite ^/api/v1/(classify.*)$ /$1 break;
            proxy_pass http://$as:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/recommend {
            set $as ai-service;
            rewrite ^/api/v1/(recommend.*)$ /$1 break;
            proxy_pass http://$as:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/kb {
            set $as ai-service;
            rewrite ^/api/v1/(kb.*)$ /$1 break;
            proxy_pass http://$as:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /api/v1/ai/health {
            set $as ai-service;
            rewrite ^/api/v1/ai/(health.*)$ /$1 break;
            proxy_pass http://$as:8002;
        }
    }
}
