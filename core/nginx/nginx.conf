# DX-FSM Nginx (thay thế APISIX)
# Routing tương đương core/apisix/routes.yaml, gọn hơn vì 1 file duy nhất.
# Lý do: APISIX image bị Docker Hub proxy chặn. Nginx nằm trong library/*,
# pull OK từ registry công ty.

user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    # Proxy defaults
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50m;  # Cho phép upload ảnh ~50MB

    # Upstream declarations
    upstream ticket-service      { server ticket-service:8001; }
    upstream ai-service          { server ai-service:8002; }
    upstream notification-service { server notification-service:8003; }

    # ─── Public server (port 80) ─────────────────────────────
    server {
        listen 80;
        server_name _;

        # CORS preflight toàn cục
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  'http://localhost:3000' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Type'                 'text/plain; charset=utf-8';
            add_header 'Content-Length'               0;
            return 204;
        }

        # Common CORS header cho mọi response
        add_header 'Access-Control-Allow-Origin'  'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Health check tổng
        location = /health {
            proxy_pass http://ticket-service/health;
        }

        # ─── Ticket Service ────────────────────────────────
        # /api/v1/tickets, /api/v1/tickets/{id}, /api/v1/tickets/{id}/comments, ...
        location /api/v1/tickets/ {
            proxy_pass         http://ticket-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
        }
        # /api/v1/tickets (không có trailing slash, exact)
        location = /api/v1/tickets {
            proxy_pass         http://ticket-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ─── User Service (qua ticket-service) ─────────────
        location /api/v1/users {
            proxy_pass         http://ticket-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ─── Notification Service ──────────────────────────
        location /api/v1/notifications {
            proxy_pass         http://notification-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ─── AI Service ─────────────────────────────────────
        # /api/v1/classify → http://ai-service:8002/classify
        location = /api/v1/classify {
            proxy_pass         http://ai-service/classify;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        # /api/v1/recommend → http://ai-service:8002/recommend
        location = /api/v1/recommend {
            proxy_pass         http://ai-service/recommend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        # /api/v1/solution, /api/v1/duplicate, /api/v1/summary (Phase 2 AI)
        location /api/v1/solution {
            proxy_pass         http://ai-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/duplicate {
            proxy_pass         http://ai-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        location /api/v1/summary {
            proxy_pass         http://ai-service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
        # AI health
        location = /api/v1/ai/health {
            proxy_pass         http://ai-service/health;
        }

        # ─── Static fallback ─────────────────────────────────
        location / {
            return 404 '{"detail":"Not found"}';
            default_type application/json;
        }
    }
}
